<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIXSPACE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0c;color:#fff;font-family:Inter,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{background:#141417;border:1px solid #29292f;border-radius:20px;padding:26px;box-shadow:0 20px 60px #0008}.auth{width:min(430px,100%)}.logo{font-weight:950;letter-spacing:6px;font-size:29px}.muted{color:#999}label{display:block;color:#aaa;font-size:13px;margin:15px 0 7px}input,textarea{width:100%;background:#0e0e11;color:#fff;border:1px solid #34343b;border-radius:11px;padding:12px;outline:none}textarea{min-height:100px;resize:vertical}input:focus,textarea:focus{border-color:#777}.primary{width:100%;border:0;border-radius:11px;padding:13px;background:#fff;color:#080808;font-weight:800;margin-top:18px}.secondary{background:#17171b;color:#fff;border:1px solid #35353b;border-radius:10px;padding:10px 14px}.link{background:none;border:0;color:#fff;text-decoration:underline}.msg{min-height:18px;color:#ff9b9b;font-size:13px;margin-top:12px}
.app{min-height:100vh;display:grid;grid-template-columns:225px 1fr}aside{background:#0d0d0f;border-right:1px solid #24242a;padding:25px 17px;height:100vh;position:sticky;top:0}nav{display:grid;gap:7px;margin-top:35px}nav button{background:none;border:0;color:#aaa;text-align:left;padding:13px;border-radius:11px}nav button.active,nav button:hover{background:#19191d;color:#fff}.logout{width:100%;margin-top:25px}main{width:min(900px,100%);margin:auto;padding:35px 22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.panel{margin-bottom:18px}.profile{display:flex;align-items:center;gap:18px}.avatar{width:82px;height:82px;border-radius:50%;background:#29292e;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.small{width:45px;height:45px;font-size:16px}.handle{color:#888}.bio{color:#d0d0d3;line-height:1.5}.search{display:flex;gap:10px}.search input{flex:1}.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #29292e}.row:last-child{border:0}.grow{flex:1}.empty{text-align:center;color:#888;padding:30px}.toast{position:fixed;right:20px;bottom:20px;background:#fff;color:#111;padding:12px 16px;border-radius:10px;font-weight:bold;z-index:5}@media(max-width:700px){.app{grid-template-columns:1fr}aside{height:auto;position:static;border-right:0;border-bottom:1px solid #24242a;padding:16px}nav{display:flex;overflow:auto;margin-top:12px}nav button{white-space:nowrap}.logout{display:none}main{padding:22px 14px}}
</style>
</head>
<body>
<section id="auth" class="center"><div class="card auth">
<div class="logo">BIXSPACE</div><p class="muted">Seu espaço. Sua identidade.</p>
<div id="loginBox"><h2>Entrar</h2><label>E-mail</label><input id="loginEmail" type="email" autocomplete="email"><label>Senha</label><input id="loginPassword" type="password" autocomplete="current-password"><button class="primary" onclick="login()">Entrar</button><p class="muted">Não tem conta? <button class="link" onclick="showRegister()">Criar conta</button></p></div>
<div id="registerBox" class="hidden"><h2>Criar conta</h2><label>Username</label><input id="regUsername" maxlength="24" placeholder="bia123"><label>Nome</label><input id="regName" maxlength="60"><label>E-mail</label><input id="regEmail" type="email" autocomplete="email"><label>Senha</label><input id="regPassword" type="password" autocomplete="new-password"><button class="primary" onclick="register()">Criar conta</button><p class="muted">Já tem conta? <button class="link" onclick="showLogin()">Entrar</button></p></div>
<div id="authMsg" class="msg"></div></div></section>
<section id="app" class="app hidden"><aside><div class="logo">BIXSPACE</div><nav>
<button id="homeNav" class="active" onclick="page('home')">⌂ Home</button><button id="searchNav" onclick="page('search')">⌕ Buscar</button><button id="profileNav" onclick="page('profile')">◎ Perfil</button></nav><button class="secondary logout" onclick="logout()">Sair</button></aside><main id="main"></main></section>
<div id="toast" class="toast hidden"></div>
<script>
const SUPABASE_URL="https://lsigxzmpzhfgkqivdifb.supabase.co";
const SUPABASE_KEY="sb_publishable_3QbWH5v7g__A6jOCsBs7ng_YcmfIYkS";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let me=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function avatar(p,small=false){let i=esc((p?.display_name||p?.username||'?').trim().charAt(0).toUpperCase());return `<div class="avatar ${small?'small':''}">${p?.avatar_url?`<img src="${esc(p.avatar_url)}" onerror="this.remove()">`:i}</div>`}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}
function showRegister(){loginBox.classList.add('hidden');registerBox.classList.remove('hidden');authMsg.textContent=''}function showLogin(){registerBox.classList.add('hidden');loginBox.classList.remove('hidden');authMsg.textContent=''}
async function register(){const username=regUsername.value.trim().toLowerCase(),name=regName.value.trim(),email=regEmail.value.trim(),password=regPassword.value;if(!/^[a-z0-9_.]{3,24}$/.test(username))return authMsg.textContent='Username: 3–24 caracteres, letras, números, _ ou .';if(password.length<6)return authMsg.textContent='A senha precisa ter pelo menos 6 caracteres.';const {data,error}=await client.auth.signUp({email,password});if(error)return authMsg.textContent=error.message;if(data.user){const r=await client.from('profiles').upsert({id:data.user.id,username,display_name:name||username},{onConflict:'id'});if(r.error)return authMsg.textContent=r.error.message}if(!data.session)return authMsg.textContent='Conta criada! Confirme seu e-mail antes de entrar.';await loadMe();start()}
async function login(){const {error}=await client.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPassword.value});if(error)return authMsg.textContent=error.message;await loadMe();start()}
async function loadMe(){const {data:{user}}=await client.auth.getUser();if(!user)return;let r=await client.from('profiles').select('*').eq('id',user.id).single();if(r.error){await client.from('profiles').insert({id:user.id,username:(user.email||'user').split('@')[0]});r=await client.from('profiles').select('*').eq('id',user.id).single()}me=r.data}
function start(){auth.classList.add('hidden');app.classList.remove('hidden');page('home')}async function logout(){await client.auth.signOut();location.reload()}
function page(p){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));({home:homeNav,search:searchNav,profile:profileNav}[p]).classList.add('active');if(p==='home')homePage();if(p==='search')searchPage();if(p==='profile')profilePage()}
function homePage(){main.innerHTML=`<div class="top"><div><h1>Home</h1><p class="muted">Bem-vinda ao BIXSPACE.</p></div>${avatar(me,true)}</div><div class="card panel"><div class="profile">${avatar(me)}<div><h2>${esc(me.display_name||me.username)}</h2><div class="handle">@${esc(me.username)}</div></div></div><hr style="border:0;border-top:1px solid #29292e;margin:22px 0"><p class="bio">${esc(me.bio||'Você ainda não adicionou uma bio.')}</p><button class="secondary" onclick="page('profile')">Editar perfil</button></div>`}
function searchPage(){main.innerHTML=`<div class="top"><div><h1>Buscar</h1><p class="muted">Encontre pessoas pelo nome ou username.</p></div></div><div class="card panel"><div class="search"><input id="query" placeholder="Digite um username ou nome..." onkeydown="if(event.key==='Enter')searchUsers()"><button class="secondary" onclick="searchUsers()">Buscar</button></div><div id="results"></div></div>`}
async function searchUsers(){const q=query.value.trim().replace(/[,%]/g,'');if(!q)return results.innerHTML='<div class="empty">Digite algo para pesquisar.</div>';const {data,error}=await client.from('profiles').select('*').or(`username.ilike.%${q}%,display_name.ilike.%${q}%`).limit(30);if(error)return results.innerHTML=`<div class="empty">${esc(error.message)}</div>`;results.innerHTML=data?.length?data.map(p=>`<div class="row">${avatar(p,true)}<div class="grow"><b>${esc(p.display_name||p.username)}</b><div class="handle">@${esc(p.username)}</div></div><button class="secondary" onclick="viewProfile('${p.id}')">Ver perfil</button></div>`).join(''):'<div class="empty">Nenhum perfil encontrado.</div>'}
async function viewProfile(id){const {data:p}=await client.from('profiles').select('*').eq('id',id).single();if(!p)return toast('Perfil não encontrado.');main.innerHTML=`<button class="secondary" onclick="searchPage()">← Voltar</button><div class="card panel" style="margin-top:15px"><div class="profile">${avatar(p)}<div><h2>${esc(p.display_name||p.username)}</h2><div class="handle">@${esc(p.username)}</div></div></div><p class="bio" style="margin-top:22px">${esc(p.bio||'Este perfil ainda não tem uma bio.')}</p>${p.about?`<p class="bio">${esc(p.about)}</p>`:''}</div>`}
function profilePage(){main.innerHTML=`<div class="top"><div><h1>Meu perfil</h1><p class="muted">Personalize seu perfil.</p></div></div><div class="card panel"><div class="profile">${avatar(me)}<div><h2>${esc(me.display_name||me.username)}</h2><div class="handle">@${esc(me.username)}</div></div></div><label>Username</label><input id="pUsername" maxlength="24" value="${esc(me.username||'')}"><label>Nome</label><input id="pName" maxlength="60" value="${esc(me.display_name||'')}"><label>Bio</label><textarea id="pBio" maxlength="300">${esc(me.bio||'')}</textarea><label>Sobre</label><textarea id="pAbout" maxlength="1000">${esc(me.about||'')}</textarea><label>URL do avatar</label><input id="pAvatar" value="${esc(me.avatar_url||'')}" placeholder="https://..."><button class="primary" onclick="saveProfile()">Salvar alterações</button></div>`}
async function saveProfile(){const username=pUsername.value.trim().toLowerCase();if(!/^[a-z0-9_.]{3,24}$/.test(username))return toast('Username inválido.');const patch={username,display_name:pName.value.trim(),bio:pBio.value.trim(),about:pAbout.value.trim(),avatar_url:pAvatar.value.trim()||null,updated_at:new Date().toISOString()};const {error}=await client.from('profiles').update(patch).eq('id',me.id);if(error)return toast(error.message);me={...me,...patch};toast('Perfil salvo ✨');profilePage()}
client.auth.onAuthStateChange(async(_,session)=>{if(session&&!me){await loadMe();start()}});(async()=>{const {data}=await client.auth.getSession();if(data.session){await loadMe();start()}})();
</script></body></html>
