<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BIXSPACE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  background:#080808;
  color:white;
}

body{
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

#app{
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 18px;
  background:rgba(5,5,5,.94);
  border-bottom:1px solid #333;
  backdrop-filter:blur(12px);
}

.logo{
  font-size:24px;
  font-weight:900;
  letter-spacing:3px;
}

.nav{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.nav button{
  background:#151515;
  color:#fff;
  border:1px solid #333;
  border-radius:10px;
  padding:8px 12px;
}

.nav button:hover{
  border-color:#777;
}

.container{
  width:min(1100px,94%);
  margin:25px auto;
}

.card{
  background:rgba(12,12,12,.92);
  border:1px solid #292929;
  border-radius:18px;
  padding:20px;
  margin-bottom:18px;
  box-shadow:0 10px 35px rgba(0,0,0,.25);
}

h1,h2,h3{
  margin-top:0;
}

input,
textarea,
select{
  width:100%;
  padding:11px;
  margin:6px 0 12px;
  color:white;
  background:#111;
  border:1px solid #333;
  border-radius:10px;
  outline:none;
}

textarea{
  min-height:110px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#aaa;
}

.primary{
  background:#fff;
  color:#000;
  border:0;
  padding:11px 16px;
  border-radius:10px;
  font-weight:bold;
}

.secondary{
  background:#191919;
  color:#fff;
  border:1px solid #444;
  padding:10px 14px;
  border-radius:10px;
}

.danger{
  background:#321313;
  color:#fff;
  border:1px solid #7d3030;
  padding:8px 12px;
  border-radius:9px;
}

.row{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.row>*{
  flex:1;
  min-width:180px;
}

.auth{
  width:min(430px,94%);
  margin:70px auto;
}

.small{
  color:#aaa;
  font-size:13px;
}

.muted{
  color:#888;
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:9999;
  padding:12px 16px;
  background:#fff;
  color:#000;
  border-radius:12px;
  font-weight:bold;
  display:none;
}

/* PROFILE */

.profile{
  position:relative;
  overflow:hidden;
  border:1px solid #333;
  border-radius:22px;
  background:#0b0b0b;
  min-height:650px;
}

.profile-banner{
  height:230px;
  background:#171717;
  background-size:cover;
  background-position:center;
  position:relative;
}

.profile-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(
    transparent 40%,
    rgba(0,0,0,.8)
  );
}

.profile-main{
  position:relative;
  margin-top:-70px;
  padding:0 30px 30px;
}

.avatar{
  width:130px;
  height:130px;
  border-radius:50%;
  object-fit:cover;
  background:#222;
  border:5px solid #0b0b0b;
}

.profile-name{
  font-size:32px;
  font-weight:900;
  margin:10px 0 3px;
}

.profile-bio{
  color:#ccc;
  white-space:pre-wrap;
}

.section{
  margin-top:25px;
}

.section-title{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.interests{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.interest{
  border:1px solid #444;
  padding:6px 10px;
  border-radius:999px;
  font-size:13px;
}

.wall-post{
  padding:13px;
  border:1px solid #2b2b2b;
  border-radius:12px;
  background:#101010;
  margin-top:8px;
}

.wall-author{
  font-weight:bold;
}

.wall-date{
  color:#777;
  font-size:11px;
}

.profile-music{
  width:100%;
}

/* DECORATIONS */

.decoration-area{
  position:relative;
  min-height:500px;
  overflow:hidden;
  border:1px dashed #333;
  border-radius:15px;
  background:
    radial-gradient(circle at center,#151515,#080808);
}

.editor-sticker{
  position:absolute;
  user-select:none;
  touch-action:none;
}

.editor-sticker img{
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}

.photo-sticker{
  position:absolute;
  user-select:none;
  touch-action:none;
  cursor:move;
}

.photo-sticker img{
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}

.sticker-controls{
  margin-top:8px;
  padding:10px;
  border:1px solid #292929;
  border-radius:12px;
  background:#0e0e0e;
}

.sticker-item{
  display:grid;
  grid-template-columns:90px 1fr;
  gap:10px;
  align-items:center;
  padding:10px;
  border-bottom:1px solid #222;
}

.sticker-item:last-child{
  border-bottom:0;
}

.sticker-thumb{
  width:80px;
  height:80px;
  object-fit:contain;
  background:#171717;
  border-radius:9px;
}

/* CUSTOM */

.custom-grid{
  display:grid;
  grid-template-columns:360px 1fr;
  gap:18px;
}

@media(max-width:850px){
  .custom-grid{
    grid-template-columns:1fr;
  }
}

.preview{
  position:sticky;
  top:75px;
  height:max-content;
}

.preview-page{
  position:relative;
  min-height:600px;
  overflow:hidden;
  border-radius:18px;
  border:1px solid #444;
  background:#090909;
  background-size:cover;
  background-position:center;
}

.preview-content{
  position:relative;
  padding:20px;
  min-height:600px;
}

.banner-preview{
  height:150px;
  border-radius:12px;
  background:#181818;
  background-size:cover;
  background-position:center;
  margin-bottom:10px;
}

.preview-name{
  font-size:25px;
  font-weight:900;
}

.preview-bio{
  color:#ccc;
  white-space:pre-wrap;
  margin-top:7px;
}

.checkline{
  display:flex;
  align-items:center;
  gap:9px;
  margin:10px 0;
}

.checkline input{
  width:auto;
  margin:0;
}

.range-row{
  display:grid;
  grid-template-columns:1fr 80px;
  gap:10px;
  align-items:center;
}

.range-row input{
  margin:0;
}

.sticker-buttons{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.sticker-button{
  font-size:25px;
  background:#151515;
  border:1px solid #333;
  border-radius:10px;
  padding:7px 10px;
}

/* SEARCH */

.search-result{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border-bottom:1px solid #292929;
}

.search-result img{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
}

/* LOADING */

.loading{
  text-align:center;
  padding:40px;
  color:#aaa;
}
</style>
</head>

<body>

<div id="app"></div>

<div id="toast" class="toast"></div>

<script type="module">

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
'https://lsigxzmpzhfgkqivdifb.supabase.co';

const SUPABASE_KEY =
'sb_publishable_3QbWH5v7g__A6jOCsBs7ng_YcmfIYkS';

const client =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   BACKGROUND REMOVAL
========================================================= */

let removeBackgroundAI = null;

async function loadBackgroundRemoval(){

  if(removeBackgroundAI)
    return removeBackgroundAI;

  try{

    const module =
      await import(
        'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.6/+esm'
      );

    removeBackgroundAI =
      module.removeBackground;

    return removeBackgroundAI;

  }catch(error){

    console.error(error);

    toast(
      'Não consegui carregar a remoção de fundo.'
    );

    return null;
  }
}


/* =========================================================
   DEFAULT CUSTOM
========================================================= */

const defaultCustom = {

  background:'#090909',

  backgroundImage:'',

  bannerImage:'',

  text:'#ffffff',

  accent:'#ffffff',

  font:'Arial',

  radius:18,

  musicUrl:'',

  musicTitle:'',

  musicAutoplay:false,

  musicVolume:0.5,

  stickers:[],

  photoStickers:[],

  interests:''
};


/* =========================================================
   STATE
========================================================= */

let currentUser = null;

let currentProfile = null;

let currentPage = 'home';

let editingCustom = null;


/* =========================================================
   HELPERS
========================================================= */

function esc(value=''){

  return String(value)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}


function toast(message){

  const el =
    document.getElementById('toast');

  el.textContent = message;

  el.style.display='block';

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(()=>{
      el.style.display='none';
    },3000);
}


function mergeCustom(custom){

  return {
    ...defaultCustom,
    ...(custom || {})
  };
}


function interestsArray(value){

  if(Array.isArray(value))
    return value;

  return String(value || '')
    .split(',')
    .map(x=>x.trim())
    .filter(Boolean);
}


/* =========================================================
   AUTH
========================================================= */

async function getSession(){

  const {
    data
  } = await client.auth.getSession();

  currentUser =
    data.session?.user || null;

  return currentUser;
}


async function signup(){

  const email =
    document.getElementById('email').value.trim();

  const password =
    document.getElementById('password').value;

  const username =
    document.getElementById('username').value.trim();

  if(!email || !password || !username){

    toast('Preencha tudo.');

    return;
  }

  const {
    data,
    error
  } =
    await client.auth.signUp({
      email,
      password
    });

  if(error){

    toast(error.message);

    return;
  }

  if(data.user){

    await client
      .from('profiles')
      .upsert({

        id:data.user.id,

        username,

        display_name:username,

        bio:'',

        about:'',

        avatar_url:'',

        custom:defaultCustom

      });

  }

  toast(
    'Conta criada! Se aparecer confirmação de email, confirme seu email.'
  );
}


async function login(){

  const email =
    document.getElementById('email').value.trim();

  const password =
    document.getElementById('password').value;

  const {
    error
  } =
    await client.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    toast(error.message);

    return;
  }

  await start();
}


async function logout(){

  await client.auth.signOut();

  currentUser=null;

  currentProfile=null;

  showAuth();
}


/* =========================================================
   AUTH SCREEN
========================================================= */

function showAuth(){

  document.getElementById('app').innerHTML=`

    <div class="auth">

      <div class="card">

        <div class="logo">
          BIXSPACE
        </div>

        <p class="small">
          seu espaço. seu perfil. suas regras.
        </p>

        <input
          id="username"
          placeholder="Nome de usuário"
        >

        <input
          id="email"
          type="email"
          placeholder="Email"
        >

        <input
          id="password"
          type="password"
          placeholder="Senha"
        >

        <div class="row">

          <button
            class="primary"
            onclick="login()"
          >
            Entrar
          </button>

          <button
            class="secondary"
            onclick="signup()"
          >
            Criar conta
          </button>

        </div>

      </div>

    </div>
  `;
}


/* =========================================================
   NAV
========================================================= */

function nav(){

  return `

  <div class="topbar">

    <div class="logo">
      BIXSPACE
    </div>

    <div class="nav">

      <button onclick="go('home')">
        Início
      </button>

      <button onclick="go('search')">
        Buscar
      </button>

      <button onclick="openMyProfile()">
        Meu perfil
      </button>

      <button onclick="go('custom')">
        Personalizar
      </button>

      <button onclick="logout()">
        Sair
      </button>

    </div>

  </div>

  `;
}


/* =========================================================
   ROUTING
========================================================= */

async function go(page){

  currentPage=page;

  if(page==='home')
    return renderHome();

  if(page==='search')
    return renderSearch();

  if(page==='custom')
    return renderCustom();

  if(page==='profile' && currentProfile)
    return renderProfile(currentProfile);
}


async function openMyProfile(){

  if(!currentUser)
    return;

  const {
    data,
    error
  } =
    await client
      .from('profiles')
      .select('*')
      .eq('id',currentUser.id)
      .single();

  if(error){

    toast(error.message);

    return;
  }

  currentProfile=data;

  renderProfile(data);
}


/* =========================================================
   HOME
========================================================= */

async function renderHome(){

  document.getElementById('app').innerHTML =
    nav()+
    `<div class="container">
       <div class="card">
         <h1>Bem-vinda ao BIXSPACE ✦</h1>
         <p>
           Crie seu perfil, personalize tudo e deixe
           seu espaço com a sua cara.
         </p>
         <button class="primary"
                 onclick="openMyProfile()">
           Abrir meu perfil
         </button>
       </div>
    </div>`;
}


/* =========================================================
   SEARCH
========================================================= */

async function renderSearch(){

  document.getElementById('app').innerHTML =
    nav()+
    `<div class="container">

      <div class="card">

        <h2>Buscar pessoas</h2>

        <input
          id="searchInput"
          placeholder="Digite um nome de usuário..."
          oninput="searchProfiles()"
        >

        <div id="searchResults"></div>

      </div>

    </div>`;
}


async function searchProfiles(){

  const q =
    document
      .getElementById('searchInput')
      .value
      .trim();

  if(!q){

    document
      .getElementById('searchResults')
      .innerHTML='';

    return;
  }

  const {
    data,
    error
  } =
    await client
      .from('profiles')
      .select('*')
      .ilike('username',`%${q}%`)
      .limit(20);

  if(error){

    toast(error.message);

    return;
  }

  document
    .getElementById('searchResults')
    .innerHTML =
      data.map(profile=>`

        <div
          class="search-result"
          onclick='viewProfile(${JSON.stringify(profile)})'
          style="cursor:pointer"
        >

          <img
            src="${esc(
              profile.avatar_url ||
              'https://via.placeholder.com/100'
            )}"
          >

          <div>

            <strong>
              ${esc(
                profile.display_name ||
                profile.username
              )}
            </strong>

            <div class="small">
              @${esc(profile.username)}
            </div>

          </div>

        </div>

      `).join('');
}


function viewProfile(profile){

  currentProfile=profile;

  renderProfile(profile);
}


/* =========================================================
   PROFILE
========================================================= */

async function renderProfile(profile){

  const custom =
    mergeCustom(profile.custom);

  document.body.style.fontFamily =
    custom.font;

  document.body.style.background =
    custom.backgroundImage
      ? `url("${custom.backgroundImage}")`
      : custom.background;

  const interests =
    interestsArray(
      custom.interests
    );

  const {
    data:posts
  } =
    await client
      .from('wall_posts')
      .select('*')
      .eq('profile_id',profile.id)
      .order('created_at',{
        ascending:false
      })
      .limit(50);

  document.getElementById('app').innerHTML =
    nav()+`

    <div class="container">

      <div
        class="profile"
        style="
          border-radius:${custom.radius}px;
          color:${custom.text};
        "
      >

        <div
          class="profile-banner"
          style="
            background-image:
              url('${esc(
                custom.bannerImage || ''
              )}');
          "
        >

          <div class="profile-overlay"></div>

        </div>

        <div class="profile-main">

          <img
            class="avatar"
            src="${esc(
              profile.avatar_url ||
              'https://via.placeholder.com/150'
            )}"
          >

          <div class="profile-name">
            ${esc(
              profile.display_name ||
              profile.username
            )}
          </div>

          <div class="small">
            @${esc(profile.username)}
          </div>

          <div class="profile-bio">
            ${esc(profile.bio || '')}
          </div>

          ${
            currentUser &&
            currentUser.id===profile.id
            ?
            `
            <div style="margin-top:10px">
              <button
                class="secondary"
                onclick="go('custom')"
              >
                ✦ Editar meu perfil
              </button>
            </div>
            `
            :
            ''
          }

          <div class="section">

            <div class="section-title">
              Sobre mim
            </div>

            <div>
              ${esc(profile.about || '')}
            </div>

          </div>

          ${
            interests.length
            ?
            `
            <div class="section">

              <div class="section-title">
                Interesses
              </div>

              <div class="interests">

                ${
                  interests
                    .map(x=>
                      `<span class="interest">
                        ${esc(x)}
                      </span>`
                    )
                    .join('')
                }

              </div>

            </div>
            `
            :
            ''
          }

          ${
            custom.musicUrl
            ?
            `
            <div class="section">

              <div class="section-title">
                🎵 ${esc(
                  custom.musicTitle ||
                  'Música'
                )}
              </div>

              <audio
                class="profile-music"
                controls
                ${
                  custom.musicAutoplay
                    ? 'autoplay'
                    : ''
                }
                src="${esc(custom.musicUrl)}"
              ></audio>

              <input
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="${custom.musicVolume}"
                oninput="
                  this.previousElementSibling.volume=this.value
                "
              >

            </div>
            `
            :
            ''
          }

          ${
            posts?.length
            ?
            `
            <div class="section">

              <div class="section-title">
                Mural
              </div>

              ${
                posts.map(post=>`

                  <div class="wall-post">

                    <div class="wall-author">
                      ${esc(
                        post.author_name ||
                        'visitante'
                      )}
                    </div>

                    <div>
                      ${esc(post.content)}
                    </div>

                    <div class="wall-date">
                      ${new Date(
                        post.created_at
                      ).toLocaleString('pt-BR')}
                    </div>

                  </div>

                `).join('')
              }

            </div>
            `
            :
            ''
          }

          ${
            currentUser
            ?
            `
            <div class="section">

              <div class="section-title">
                Deixar uma mensagem
              </div>

              <textarea
                id="wallMessage"
                placeholder="Escreva algo..."
              ></textarea>

              <button
                class="primary"
                onclick="postWall('${profile.id}')"
              >
                Publicar
              </button>

            </div>
            `
            :
            ''
          }

          ${
            custom.photoStickers?.length ||
            custom.stickers?.length
            ?
            `
            <div class="section">

              <div class="decoration-area"
                   style="
                     background:
                     transparent;
                   ">

                ${renderDecorations(custom)}

              </div>

            </div>
            `
            :
            ''
          }

        </div>

      </div>

    </div>
  `;

  setupProfileAudio(custom);

}


/* =========================================================
   DECORATIONS
========================================================= */

function renderDecorations(custom){

  let html='';

  (custom.stickers || [])
    .forEach(sticker=>{

      html+=`

        <div
          class="editor-sticker"
          style="
            left:${sticker.x || 50}%;
            top:${sticker.y || 50}%;
            width:${sticker.width || 60}px;
            height:${sticker.height || 60}px;
          "
        >

          <img
            src="${esc(sticker.image)}"
          >

        </div>

      `;
    });


  (custom.photoStickers || [])
    .forEach(sticker=>{

      const image =
        sticker.removeBackground &&
        sticker.processedImage
          ?
          sticker.processedImage
          :
          sticker.image;

      html+=`

        <div
          class="photo-sticker"
          style="
            left:${sticker.x || 50}%;
            top:${sticker.y || 50}%;
            width:${sticker.width || 150}px;
            height:${sticker.height || 150}px;
          "
        >

          <img
            src="${esc(image)}"
          >

        </div>

      `;
    });

  return html;
}


function setupProfileAudio(custom){

  const audio =
    document.querySelector('.profile-music');

  if(!audio)
    return;

  audio.volume =
    Number(custom.musicVolume ?? .5);

  if(custom.musicAutoplay){

    audio.play().catch(()=>{
      /*
        Navegadores podem bloquear autoplay
        com som. Nesse caso o visitante
        precisa apertar Play.
      */
    });
  }
}


/* =========================================================
   WALL
========================================================= */

async function postWall(profileId){

  const content =
    document
      .getElementById('wallMessage')
      .value
      .trim();

  if(!content)
    return;

  const {
    error
  } =
    await client
      .from('wall_posts')
      .insert({

        profile_id:profileId,

        author_id:currentUser.id,

        author_name:
          currentProfile?.display_name ||
          currentUser.email?.split('@')[0] ||
          'visitante',

        content

      });

/* =========================================================
   REAL BACKGROUND REMOVAL
========================================================= */

async function toggleBackgroundRemoval(
  index,
  enabled
){

  const sticker =
    editingCustom.photoStickers[index];

  if(!sticker)
    return;

  if(!enabled){

    sticker.removeBackground=false;

    updatePreview();

    return;
  }

  if(sticker.processedImage){

    sticker.removeBackground=true;

    updatePreview();

    return;
  }

  toast(
    'Removendo o fundo... isso pode demorar um pouco na primeira vez.'
  );

  try{

    const removeBackground =
      await loadBackgroundRemoval();

    if(!removeBackground)
      return;

    const response =
      await fetch(
        sticker.image
      );

    const blob =
      await response.blob();

    const result =
      await removeBackground(
        blob,
        {
          output:{
            format:'image/png',
            quality:.9
          }
        }
      );

    const processedFile =
      new File(
        [result],
        `sticker-${Date.now()}.png`,
        {
          type:'image/png'
        }
      );

    const processedUrl =
      await uploadFile(
        'bix-images',
        processedFile,
        'stickers-processed'
      );

    sticker.processedImage =
      processedUrl;

    sticker.removeBackground=true;

    updatePreview();

    toast(
      'Fundo removido! ✨'
    );

  }catch(error){

    console.error(error);

    sticker.removeBackground=false;

    updatePreview();

    toast(
      'Não foi possível remover o fundo.'
    );
  }
}

/* =========================================================
   DRAGGING
========================================================= */

function enableDragging(){

  const area =
    document.getElementById(
      'previewDecorationArea'
    );

  if(!area)
    return;

  const elements =
    area.querySelectorAll(
      '.photo-sticker,.editor-sticker'
    );

  elements.forEach((element)=>{

    let dragging=false;

    let startX=0;
    let startY=0;

    let originalX=0;
    let originalY=0;

    element.addEventListener(
      'pointerdown',
      event=>{

        dragging=true;

        element.setPointerCapture(
          event.pointerId
        );

        startX=event.clientX;
        startY=event.clientY;

        originalX =
          parseFloat(
            element.style.left
          ) || 50;

        originalY =
          parseFloat(
            element.style.top
          ) || 50;

        event.preventDefault();
      }
    );

    element.addEventListener(
      'pointermove',
      event=>{

        if(!dragging)
          return;

        const rect =
          area.getBoundingClientRect();

        const dx =
          (
            event.clientX-startX
          ) /
          rect.width *
          100;

        const dy =
          (
            event.clientY-startY
          ) /
          rect.height *
          100;

        const newX =
          Math.max(
            0,
            Math.min(
              95,
              originalX+dx
            )
          );

        const newY =
          Math.max(
            0,
            Math.min(
              95,
              originalY+dy
            )
          );

        element.style.left =
          newX+'%';

        element.style.top =
          newY+'%';

      }
    );

    element.addEventListener(
      'pointerup',
      event=>{

        if(!dragging)
          return;

        dragging=false;

        const rect =
          area.getBoundingClientRect();

        const x =
          parseFloat(
            element.style.left
          );

        const y =
          parseFloat(
            element.style.top
          );

        const photoElements =
          [
            ...area.querySelectorAll(
              '.photo-sticker'
            )
          ];

        const photoIndex =
          photoElements.indexOf(
            element
          );

        if(photoIndex>=0){

          editingCustom
            .photoStickers[
              photoIndex
            ].x=x;

          editingCustom
            .photoStickers[
              photoIndex
            ].y=y;

        }else{

          const emojiElements =
            [
              ...area.querySelectorAll(
                '.editor-sticker'
              )
            ];

          const emojiIndex =
            emojiElements.indexOf(
              element
            );

          if(emojiIndex>=0){

            editingCustom
              .stickers[
                emojiIndex
              ].x=x;

            editingCustom
              .stickers[
                emojiIndex
              ].y=y;

          }
        }
      }
    );

  });
}


/* =========================================================
   FILE UPLOAD
========================================================= */

async function uploadFile(
  bucket,
  file,
  folder
){

  if(!currentUser)
    throw new Error(
      'Você precisa estar logada.'
    );

  const cleanName =
    file.name
      .replace(
        /[^a-zA-Z0-9._-]/g,
        '_'
      );

  const path =
    `${currentUser.id}/${folder}/${Date.now()}-${cleanName}`;

  const {
    error
  } =
    await client
      .storage
      .from(bucket)
      .upload(
        path,
        file,
        {
          upsert:false,

          cacheControl:'3600',

          contentType:
            file.type ||
            undefined
        }
      );

  if(error)
    throw error;

  const {
    data
  } =
    client
      .storage
      .from(bucket)
      .getPublicUrl(path);

  return data.publicUrl;
}

async function uploadBanner(input){

  const file =
    input.files?.[0];

  if(!file)
    return;

  try{

    toast('Enviando banner...');

    const url =
      await uploadFile(
        'bix-images',
        file,
        'banners'
      );

    document
      .getElementById(
        'cBannerUrl'
      )
      .value=url;

    editingCustom.bannerImage=url;

    updatePreview();

    toast(
      'Banner adicionado!'
    );

  }catch(error){

    toast(error.message);

  }
}

/* =========================================================
   SAVE
========================================================= */

async function saveCustomization(){

  const custom =
    readEditor();

  const displayName =
    document
      .getElementById(
        'cDisplayName'
      )
      .value
      .trim();

  const bio =
    document
      .getElementById(
        'cBio'
      )
      .value;

  const about =
    document
      .getElementById(
        'cAbout'
      )
      .value;

  const {
    error
  } =
    await client
      .from('profiles')
      .update({

        display_name:
          displayName,

        bio:
          bio,

        about:
          about,

        custom:
          custom

      })
      .eq(
        'id',
        currentUser.id
      );

  if(error){

    console.error(error);

    toast(
      'Erro ao salvar: '+
      error.message
    );

    return;
  }

  currentProfile={
    ...currentProfile,

    display_name:displayName,

    bio,

    about,

    custom

  };

  editingCustom=custom;

  toast(
    '✨ Seu BIXSPACE foi salvo!'
  );

}

   START
========================================================= */

async function start(){

  const user =
    await getSession();

  if(!user){

    showAuth();

    return;
  }

  await renderHome();
}
