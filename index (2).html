<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIXSPACE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#080808;color:#fff}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{background:#151515;border:1px solid #292929;border-radius:18px;padding:22px;box-shadow:0 20px 60px #0009}.auth{width:min(430px,100%)}.logo{font-weight:950;letter-spacing:7px;font-size:30px}.muted{color:#999}label{display:block;color:#aaa;font-size:13px;margin:14px 0 7px}input,textarea,select{width:100%;background:#0d0d0d;color:#fff;border:1px solid #333;border-radius:10px;padding:11px;outline:0}textarea{min-height:90px;resize:vertical}.primary{border:0;background:#fff;color:#080808;font-weight:800;border-radius:10px;padding:12px 16px}.secondary{background:#191919;color:#fff;border:1px solid #383838;border-radius:10px;padding:10px 14px}.danger{background:#251414;color:#ffb5b5;border-color:#5b2929}.link{background:none;border:0;color:#fff;text-decoration:underline}.msg{min-height:18px;color:#ff9c9c;font-size:13px;margin-top:10px}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}aside{background:#0d0d0d;border-right:1px solid #242424;padding:24px 16px;position:sticky;top:0;height:100vh}nav{display:grid;gap:6px;margin-top:30px}nav button{background:none;border:0;color:#999;text-align:left;padding:12px;border-radius:10px}nav button.active,nav button:hover{background:#1a1a1a;color:#fff}.logout{width:100%;margin-top:25px}main{width:min(1100px,100%);margin:auto;padding:30px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 330px;gap:18px}.profile-card{overflow:hidden;padding:0}.cover{height:180px;background:#222 center/cover no-repeat;position:relative}.profile-head{padding:0 22px 22px;position:relative}.avatar{width:92px;height:92px;border-radius:50%;background:#292929;border:4px solid #151515;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.profile-head .avatar{margin-top:-46px}.handle{color:#888}.bio{line-height:1.6;color:#ddd;white-space:pre-wrap}.section-title{font-size:13px;text-transform:uppercase;letter-spacing:2px;color:#888;margin-bottom:12px}.wall-post{border-top:1px solid #292929;padding:14px 0}.wall-post:first-child{border-top:0}.wall-meta{font-size:12px;color:#777;margin-top:6px}.search{display:flex;gap:8px}.search input{flex:1}.row{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #292929}.grow{flex:1}.empty{text-align:center;color:#888;padding:25px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:7px 10px;border:1px solid #3b3b3b;border-radius:999px;background:#1a1a1a;font-size:13px}.music{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid #333;border-radius:12px;background:#101010}.music-icon{font-size:26px}.sticker-area{position:relative;min-height:220px;border:1px dashed #444;border-radius:12px;overflow:hidden;background:#0d0d0d}.sticker{position:absolute;user-select:none}.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:34px;height:34px;border-radius:50%;border:2px solid #555;cursor:pointer}.custom-preview{min-height:260px;border-radius:16px;padding:22px;position:relative;overflow:hidden}.toast{position:fixed;right:18px;bottom:18px;background:#fff;color:#111;padding:12px 16px;border-radius:10px;font-weight:700;z-index:10}@media(max-width:800px){.app{grid-template-columns:1fr}aside{height:auto;position:static;border-right:0;border-bottom:1px solid #242424;padding:16px}nav{display:flex;overflow:auto;margin-top:12px}nav button{white-space:nowrap}.logout{display:none}.grid{grid-template-columns:1fr}.editor-grid{grid-template-columns:1fr}.full{grid-column:auto}main{padding:20px 14px}}
</style>
</head>
<body>
<section id="auth" class="center"><div class="card auth"><div class="logo">BIXSPACE</div><p class="muted">Seu espaço. Sua identidade.</p><div id="loginBox"><h2>Entrar</h2><label>E-mail</label><input id="loginEmail" type="email"><label>Senha</label><input id="loginPassword" type="password"><button class="primary" style="width:100%;margin-top:18px" onclick="login()">Entrar</button><p class="muted">Ainda não tem conta? <button class="link" onclick="showRegister()">Criar conta</button></p></div><div id="registerBox" class="hidden"><h2>Criar conta</h2><label>Username</label><input id="regUsername" maxlength="24" placeholder="bia123"><label>Nome</label><input id="regName" maxlength="60" placeholder="Bia"><label>E-mail</label><input id="regEmail" type="email"><label>Senha</label><input id="regPassword" type="password"><button class="primary" style="width:100%;margin-top:18px" onclick="register()">Criar conta</button><p class="muted">Já tem conta? <button class="link" onclick="showLogin()">Entrar</button></p></div><div id="authMsg" class="msg"></div></div></section>
<section id="app" class="app hidden"><aside><div class="logo">BIXSPACE</div><nav><button id="homeNav" class="active" onclick="page('home')">⌂ Início</button><button id="searchNav" onclick="page('search')">⌕ Buscar</button><button id="profileNav" onclick="page('profile')">◎ Meu espaço</button><button id="customNav" onclick="page('custom')">✦ Personalizar</button></nav><button class="secondary logout" onclick="logout()">Sair</button></aside><main id="main"></main></section><div id="toast" class="toast hidden"></div>
<script>
const SUPABASE_URL='https://lsigxzmpzhfgkqivdifb.supabase.co';
const SUPABASE_KEY='sb_publishable_3QbWH5v7g__A6jOCsBs7ng_YcmfIYkS';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let me=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaultCustom={background:'#090909',backgroundImage:'',text:'#ffffff',accent:'#ffffff',font:'Arial',radius:18,musicUrl:'',musicTitle:'',stickers:[],interests:[]};
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}
function avatar(p,small=false){let l=esc((p?.display_name||p?.username||'?').trim().charAt(0).toUpperCase());return `<div class="avatar" style="${small?'width:45px;height:45px;font-size:16px':''}">${p?.avatar_url?`<img src="${esc(p.avatar_url)}" onerror="this.remove()">`:l}</div>`}
function getCustom(p=me){let c=p?.customization||{};return {...defaultCustom,...c}}
function styleFor(p=me){const c=getCustom(p);return `background:${esc(c.background)};color:${esc(c.text)};font-family:${esc(c.font)};--accent:${esc(c.accent)};`}
function applyPageStyle(p=me){document.body.style.background=getCustom(p).background;document.body.style.color=getCustom(p).text;document.body.style.fontFamily=getCustom(p).font||'Arial'}
function showRegister(){loginBox.classList.add('hidden');registerBox.classList.remove('hidden');authMsg.textContent=''}function showLogin(){registerBox.classList.add('hidden');loginBox.classList.remove('hidden');authMsg.textContent=''}
async function register(){const username=regUsername.value.trim().toLowerCase(),name=regName.value.trim(),email=regEmail.value.trim(),password=regPassword.value;if(!/^[a-z0-9_.]{3,24}$/.test(username))return authMsg.textContent='Username: 3–24 caracteres, letras, números, _ ou .';if(password.length<6)return authMsg.textContent='A senha precisa ter pelo menos 6 caracteres.';authMsg.textContent='Criando sua conta…';const {data,error}=await client.auth.signUp({email,password});if(error)return authMsg.textContent=error.message;if(data.user){const r=await client.from('profiles').upsert({id:data.user.id,username,display_name:name||username,customization:defaultCustom,interests:[]},{onConflict:'id'});if(r.error)return authMsg.textContent=r.error.message}if(!data.session)return authMsg.textContent='Conta criada! Confira seu e-mail para confirmar a conta.';await loadMe();start()}
async function login(){authMsg.textContent='Entrando…';const {error}=await client.auth.signInWithPassword({email:loginEmail.value.trim(),password:loginPassword.value});if(error)return authMsg.textContent=error.message;await loadMe();start()}
async function loadMe(){const {data:{user}}=await client.auth.getUser();if(!user)return;let r=await client.from('profiles').select('*').eq('id',user.id).single();if(r.error){await client.from('profiles').insert({id:user.id,username:'user_'+user.id.slice(0,8),display_name:'Usuário',customization:defaultCustom,interests:[]});r=await client.from('profiles').select('*').eq('id',user.id).single()}me=r.data;applyPageStyle()}
function start(){auth.classList.add('hidden');app.classList.remove('hidden');page('home')}
async function logout(){await client.auth.signOut();location.reload()}
function page(p){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));const map={home:homeNav,search:searchNav,profile:profileNav,custom:customNav};if(map[p])map[p].classList.add('active');({home:homePage,search:searchPage,profile:profilePage,custom:customPage}[p])()}
async function homePage(){applyPageStyle();const posts=await loadPosts(me.id);main.innerHTML=`<div class="top"><div><h1>Início</h1><p class="muted">Seu espaço no BIXSPACE.</p></div>${avatar(me,true)}</div>${profileCard(me,posts,true)}`}
function profileCard(p,posts,own=false){const c=getCustom(p), interests=(p.interests||[]).filter(Boolean);let bg=c.backgroundImage?`background-image:url('${esc(c.backgroundImage)}');background-color:${esc(c.background)}`:`background:${esc(c.background)}`;return `<div class="grid"><div><div class="card profile-card" style="${styleFor(p)}"><div class="cover" style="${bg}"></div><div class="profile-head"><div class="avatar">${p.avatar_url?`<img src="${esc(p.avatar_url)}">`:esc((p.display_name||p.username||'?').charAt(0).toUpperCase())}</div><h1>${esc(p.display_name||p.username)}</h1><div class="handle">@${esc(p.username)}</div><p class="bio">${esc(p.bio||'Este perfil ainda não tem uma bio.')}</p>${p.about?`<h3>Sobre mim</h3><p class="bio">${esc(p.about)}</p>`:''}<div class="section-title">Interesses</div><div class="chips">${interests.length?interests.map(x=>`<span class="chip">${esc(x)}</span>`).join(''):'<span class="muted">Nenhum interesse adicionado.</span>'}</div>${c.musicUrl?`<div style="margin-top:20px"><div class="section-title">Música</div><div class="music"><div class="music-icon">🎵</div><div><b>${esc(c.musicTitle||'Minha música')}</b><br><a href="${esc(c.musicUrl)}" target="_blank" rel="noopener" style="color:var(--accent,#fff)">Ouvir música</a></div></div></div>`:''}</div></div><div class="card" style="margin-top:18px"><div class="section-title">Mural</div>${own?`<textarea id="wallText" maxlength="500" placeholder="O que você quer compartilhar?"></textarea><button class="primary" style="margin-top:9px" onclick="addWallPost()">Publicar atualização</button>`:''}<div id="wallList">${renderPosts(posts)}</div></div></div><div><div class="card"><div class="section-title">Decoração</div><div class="sticker-area">${renderStickers(c)}</div></div>${own?`<button class="secondary" style="width:100%;margin-top:12px" onclick="page('custom')">✦ Personalizar meu espaço</button>`:''}</div></div>`}
function renderStickers(c){return (c.stickers||[]).map(s=>`<span class="sticker" style="left:${Number(s.x)||10}%;top:${Number(s.y)||10}%;font-size:${Number(s.size)||32}px">${esc(s.char)}</span>`).join('')}
async function loadPosts(profileId){const {data}=await client.from('wall_posts').select('*').eq('profile_id',profileId).order('created_at',{ascending:false}).limit(30);return data||[]}
function renderPosts(posts){if(!posts.length)return '<div class="empty">Ainda não há atualizações no mural.</div>';return posts.map(x=>`<div class="wall-post"><div>${esc(x.content)}</div><div class="wall-meta">${new Date(x.created_at).toLocaleString('pt-BR')}</div></div>`).join('')}
async function addWallPost(){const text=wallText.value.trim();if(!text)return toast('Escreva uma atualização.');const {error}=await client.from('wall_posts').insert({profile_id:me.id,content:text});if(error)return toast(error.message);homePage()}
function searchPage(){main.innerHTML=`<div class="top"><div><h1>Buscar</h1><p class="muted">Encontre pessoas pelo nome ou username.</p></div></div><div class="card"><div class="search"><input id="query" placeholder="Nome ou username..." onkeydown="if(event.key==='Enter')searchUsers()"><button class="secondary" onclick="searchUsers()">Buscar</button></div><div id="results"></div></div>`}
async function searchUsers(){const q=query.value.trim().replace(/[,%]/g,'');if(!q)return results.innerHTML='<div class="empty">Digite algo para pesquisar.</div>';const {data,error}=await client.from('profiles').select('*').or(`username.ilike.%${q}%,display_name.ilike.%${q}%`).limit(30);if(error)return results.innerHTML=`<div class="empty">${esc(error.message)}</div>`;results.innerHTML=data?.length?data.map(p=>`<div class="row">${avatar(p,true)}<div class="grow"><b>${esc(p.display_name||p.username)}</b><div class="handle">@${esc(p.username)}</div></div><button class="secondary" onclick="viewProfile('${p.id}')">Ver espaço</button></div>`).join(''):'<div class="empty">Nenhum perfil encontrado.</div>'}
async function viewProfile(id){const {data:p}=await client.from('profiles').select('*').eq('id',id).single();if(!p)return toast('Perfil não encontrado.');const posts=await loadPosts(id);main.innerHTML=`<button class="secondary" onclick="searchPage()">← Voltar</button><div style="margin-top:15px">${profileCard(p,posts,false)}</div>`}
function profilePage(){main.innerHTML=`<div class="top"><div><h1>Meu espaço</h1><p class="muted">Seu conteúdo no BIXSPACE.</p></div></div>${profileCard(me,[],true)}`;loadPosts(me.id).then(p=>{const e=document.getElementById('wallList');if(e)e.innerHTML=renderPosts(p)})}
function customPage(){const c=getCustom();const interests=(me.interests||[]).join(', ');main.innerHTML=`<div class="top"><div><h1>Personalizar</h1><p class="muted">Faça seu BIXSPACE ter a sua cara — estilo MySpace.</p></div><button class="primary" onclick="saveCustomization()">Salvar tudo</button></div><div class="card"><div class="editor-grid"><div><label>Cor do fundo</label><input id="cBg" type="color" value="${esc(c.background)}"></div><div><label>Cor do texto</label><input id="cText" type="color" value="${esc(c.text)}"></div><div><label>Cor de destaque</label><input id="cAccent" type="color" value="${esc(c.accent)}"></div><div><label>Fonte</label><select id="cFont"><option>Arial</option><option>Georgia</option><option>Verdana</option><option>Courier New</option><option>Trebuchet MS</option><option>Times New Roman</option></select></div><div class="full"><label>Imagem do fundo / parede — URL</label><input id="cBgImage" value="${esc(c.backgroundImage)}" placeholder="https://..."></div><div><label>Música — título</label><input id="cMusicTitle" value="${esc(c.musicTitle)}" placeholder="Minha música favorita"></div><div><label>Música — link</label><input id="cMusicUrl" value="${esc(c.musicUrl)}" placeholder="Link do Spotify/YouTube/etc."></div><div class="full"><label>Interesses — separados por vírgulas</label><input id="cInterests" value="${esc(interests)}" placeholder="Música, filmes, jogos, moda..."></div><div class="full"><label>Stickers</label><div class="chips" id="stickerChoices">${['⭐','💿','🎀','🦋','🌙','☁️','💗','🖤','✨','🌸','🎧','🍒','🪩','🧸','📺'].map(x=>`<button class="chip" onclick="addSticker('${x}')">${x}</button>`).join('')}</div><div id="stickerEditor" style="margin-top:12px">${(c.stickers||[]).map((s,i)=>`<div class="row"><span style="font-size:25px">${esc(s.char)}</span><input type="number" min="0" max="95" value="${Number(s.x)||10}" onchange="updateSticker(${i},'x',this.value)" style="width:90px"><input type="number" min="0" max="95" value="${Number(s.y)||10}" onchange="updateSticker(${i},'y',this.value)" style="width:90px"><input type="number" min="12" max="100" value="${Number(s.size)||32}" onchange="updateSticker(${i},'size',this.value)" style="width:90px"><button class="secondary danger" onclick="removeSticker(${i})">Remover</button></div>`).join('')}</div></div><div class="full"><label>Prévia</label><div id="preview" class="custom-preview"></div></div></div></div>`;cFont.value=c.font;updatePreview()}
let editStickers=[];
function syncStickerState(){const c=getCustom();editStickers=JSON.parse(JSON.stringify(c.stickers||[]))}
function addSticker(ch){if(!editStickers.length)syncStickerState();editStickers.push({char:ch,x:10+Math.random()*70,y:10+Math.random()*70,size:34});customPage()}
function updateSticker(i,k,v){if(!editStickers.length)syncStickerState();editStickers[i][k]=Number(v);customPage()}
function removeSticker(i){if(!editStickers.length)syncStickerState();editStickers.splice(i,1);customPage()}
function updatePreview(){const e=document.getElementById('preview');if(!e)return;const c=getCustom();e.style.background=c.backgroundImage?`url('${c.backgroundImage}') center/cover, ${c.background}`:c.background;e.style.color=c.text;e.style.fontFamily=c.font;e.innerHTML=`<h2>${esc(me.display_name||me.username)}</h2><p>Prévia do seu espaço ✨</p>${(editStickers.length?editStickers:c.stickers||[]).map(s=>`<span class="sticker" style="left:${s.x}%;top:${s.y}%;font-size:${s.size}px">${esc(s.char)}</span>`).join('')}`}
async function saveCustomization(){const old=getCustom();const stickers=editStickers.length?editStickers:(old.stickers||[]);const c={background:cBg.value,text:cText.value,accent:cAccent.value,font:cFont.value,backgroundImage:cBgImage.value.trim(),musicTitle:cMusicTitle.value.trim(),musicUrl:cMusicUrl.value.trim(),stickers};const interests=cInterests.value.split(',').map(x=>x.trim()).filter(Boolean).slice(0,30);const {error}=await client.from('profiles').update({customization:c,interests,updated_at:new Date().toISOString()}).eq('id',me.id);if(error)return toast(error.message);me={...me,customization:c,interests};editStickers=[];applyPageStyle();toast('Tudo salvo ✨');profilePage()}
client.auth.onAuthStateChange(async(_,session)=>{if(session&&!me){await loadMe();start()}});(async()=>{const {data}=await client.auth.getSession();if(data.session){await loadMe();start()}})();
</script></body></html>
